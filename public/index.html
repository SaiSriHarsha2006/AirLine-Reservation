<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SkyPulse · Live Flight Radar & Airspace Boarding Control</title>
  <meta name="description" content="Next-generation real-time flight tracking, avionics radar telemetry, and passenger gate boarding control system.">
  <meta name="theme-color" content="#080c16">
  
  <!-- Modern Typography: Outfit (Brand/Headers), Inter (UI), JetBrains Mono (Avionics/Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet Map CSS for Live Flight Radar -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Leaflet Map JS -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Script -->
  <script src="app.js" defer></script>
</head>
<body class="theme-dark">
  <div id="app"></div>
  <div id="modal-container"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>
    <div style="padding: 2rem; text-align: center; color: #fff; background: #080c16; font-family: sans-serif;">
      <h2>JavaScript Required</h2>
      <p>SkyPulse Live Flight Radar & Boarding Control requires JavaScript to display real-time avionics radar and manifest data.</p>
    </div>
  </noscript>
</body>
</html>
